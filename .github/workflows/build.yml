          package com.atlas.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.graphics.Color
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {

              private var micGranted by mutableStateOf(false)
              private var pendingPerms: Array<String> = emptyArray()

              private val launcher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { result ->
                  micGranted = result[Manifest.permission.RECORD_AUDIO] == true
                  if (micGranted) startAtlas()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Atlas.appCtx = applicationContext

                  val wanted = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS
                  )
                  if (Build.VERSION.SDK_INT >= 33) {
                      wanted += Manifest.permission.POST_NOTIFICATIONS
                      wanted += Manifest.permission.READ_MEDIA_AUDIO
                  } else {
                      wanted += Manifest.permission.READ_EXTERNAL_STORAGE
                  }
                  pendingPerms = wanted.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }.toTypedArray()
                  micGranted = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                          PackageManager.PERMISSION_GRANTED

                  if (micGranted) startAtlas() else launcher.launch(pendingPerms)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(background = Color(0xFF05070C))) {
                          if (micGranted) HudScreen(onSend = { Atlas.ask(it) })
                          else PermissionGate { launcher.launch(pendingPerms) }
                      }
                  }
              }

              private fun startAtlas() {
                  VoiceOutput.init(this)
                  ContextCompat.startForegroundService(this, Intent(this, AtlasService::class.java))
              }
          }
          FIM_MAIN

