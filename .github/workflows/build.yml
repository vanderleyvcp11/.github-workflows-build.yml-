          private fun statusText(s: Bus.State) = when (s) {
              Bus.State.IDLE -> "DIGA: JARVIS"
              Bus.State.LISTENING -> "OUVINDO..."
              Bus.State.PROCESSING -> "PROCESSANDO..."
              Bus.State.SPEAKING -> "RESPONDENDO..."
          }

          private fun statusColor(s: Bus.State) = when (s) {
              Bus.State.IDLE -> CYAN.copy(alpha = 0.5f)
              Bus.State.LISTENING -> CYAN
              Bus.State.PROCESSING -> AMBER
              Bus.State.SPEAKING -> GREEN
          }

          @Composable
          fun Reactor(state: Bus.State) {
              val inf = rememberInfiniteTransition(label = "reactor")
              val rot by inf.animateFloat(
                  0f, 360f, infiniteRepeatable(tween(9000, easing = LinearEasing)), label = "rot")
              val pulse by inf.animateFloat(
                  0.94f, 1.06f,
                  infiniteRepeatable(tween(700, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse")

              val color = when (state) {
                  Bus.State.LISTENING -> CYAN
                  Bus.State.PROCESSING -> AMBER
                  Bus.State.SPEAKING -> GREEN
                  else -> CYAN.copy(alpha = 0.55f)
              }
              val scale = if (state == Bus.State.LISTENING) pulse else 1f

              Canvas(Modifier.size(250.dp).graphicsLayer {
                  scaleX = scale; scaleY = scale; rotationZ = rot
              }) {
                  val r = size.minDimension / 2f
                  val c = center
                  drawCircle(
                      Brush.radialGradient(
                          listOf(color.copy(alpha = 0.30f), Color.Transparent),
                          center = c, radius = r
                      ), radius = r, center = c
                  )
                  repeat(24) { i ->
                      drawArc(color.copy(alpha = 0.9f), i * 15f + 4f, 7f, false, style = Stroke(5f))
                  }
                  repeat(8) { i ->
                      drawArc(color.copy(alpha = 0.6f), i * 45f + 10f, 22f, false,
                          topLeft = Offset(c.x - r * 0.66f, c.y - r * 0.66f),
                          size = Size(r * 1.32f, r * 1.32f), style = Stroke(12f))
                  }
                  drawCircle(color, radius = r * 0.34f, center = c, style = Stroke(4f))
                  drawCircle(
                      Brush.radialGradient(
                          listOf(Color.White.copy(alpha = 0.9f), color, Color.Transparent),
                          center = c, radius = r * 0.3f
                      ), radius = r * 0.3f, center = c
                  )
                  val tri = Path().apply {
                      moveTo(c.x, c.y - r * 0.18f)
                      lineTo(c.x + r * 0.16f, c.y + r * 0.12f)
                      lineTo(c.x - r * 0.16f, c.y + r * 0.12f)
                      close()
                  }
                  drawPath(tri, Color.White.copy(alpha = 0.85f))
              }
          }

          @Composable
          fun PermissionGate(onRequest: () -> Unit) {
              Column(
                  Modifier.fillMaxSize().background(BG).padding(32.dp),
