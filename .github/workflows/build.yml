          }
          FIM_HUD

          cat > app/src/main/java/com/atlas/assistant/MainActivity.kt << 'FIM_MAIN'
          package com.atlas.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.graphics.Color
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {

              private var micGranted by mutableStateOf(false)
              private var pendingPerms: Array<String> = emptyArray()

              private val launcher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { result ->
                  micGranted = result[Manifest.permission.RECORD_AUDIO] == true
                  if (micGranted) startAtlas()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Atlas.appCtx = applicationContext

                  val wanted = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS
                  )
                  if (Build.VERSION.SDK_INT >= 33) {
                      wanted += Manifest.permission.POST_NOTIFICATIONS
                      wanted += Manifest.permission.READ_MEDIA_AUDIO
                  } else {
                      wanted += Manifest.permission.READ_EXTERNAL_STORAGE
                  }
                  pendingPerms = wanted.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }.toTypedArray()
                  micGranted = ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                          PackageManager.PERMISSION_GRANTED

                  if (micGranted) startAtlas() else launcher.launch(pendingPerms)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(background = Color(0xFF01040A))) {
                          if (micGranted) HudScreen(onSend = { Atlas.ask(it) })
                          else PermissionGate { launcher.launch(pendingPerms) }
                      }
                  }
              }

              private fun startAtlas() {
                  VoiceOutput.init(this)
                  ContextCompat.startForegroundService(this, Intent(this, AtlasService::class.java))
              }
          }
          FIM_MAIN

          cat > app/src/main/java/com/atlas/assistant/BootReceiver.kt << 'FIM_BOOT'
          package com.atlas.assistant

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import androidx.core.content.ContextCompat

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED &&
                      ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      try {
                          ContextCompat.startForegroundService(context, Intent(context, AtlasService::class.java))
                      } catch (_: Exception) {}
                  }
              }
          }
          FIM_BOOT

          echo "Projeto 3.2 gerado com sucesso."

      - name: Compilar APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Diagnostico no resumo (aparece se falhar)
        if: failure()
        run: |
          {
            echo "### Diagnostico da falha (raio-X):"
            echo ""
            grep -nE "^e: |error: |FAILURE:|What went wrong" /tmp/build.log | head -40
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Publicar artefato (download via login)
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar Release (link direto, sem login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ATLAS 3.2 - v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
