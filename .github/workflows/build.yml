          cat > app/src/main/java/com/atlas/assistant/VoskSpeech.kt << 'FIM_VOSK'
          package com.atlas.assistant

          import android.content.Context
          import kotlinx.coroutines.flow.MutableStateFlow
          import org.vosk.Model
          import java.io.BufferedInputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.ZipInputStream

          object VoskSpeech {
              private const val MODEL_URL = "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip"
              private const val MODEL_DIR = "vosk-pt"
              private const val ZIP_NAME = "vosk-pt.zip"

              val status = MutableStateFlow(-1)
              val progress = MutableStateFlow(0)

              @Volatile
              private var model: Model? = null

              fun refresh(ctx: Context) {
                  status.value = if (isReady(ctx)) 2 else 0
              }

              fun modelDir(ctx: Context): File = File(ctx.filesDir, MODEL_DIR)

              fun isReady(ctx: Context): Boolean =
                  File(modelDir(ctx), "am/final.mdl").exists()

              @Synchronized
              fun model(ctx: Context): Model {
                  model?.let { return it }
                  val m = Model(modelDir(ctx).absolutePath)
                  model = m
                  return m
              }

              fun download(ctx: Context) {
                  if (status.value == 1) return
                  status.value = 1
                  progress.value = 0
                  Thread {
                      try {
                          val tmpZip = File(ctx.cacheDir, ZIP_NAME)
                          val c = URL(MODEL_URL).openConnection() as HttpURLConnection
                          c.connectTimeout = 20000
                          c.readTimeout = 60000
                          val total = c.contentLengthLong
                          c.inputStream.use { raw ->
                              BufferedInputStream(raw).use { bis ->
                                  FileOutputStream(tmpZip).use { out ->
                                      val buf = ByteArray(65536)
                                      var read: Int
                                      var done = 0L
                                      while (bis.read(buf).also { read = it } != -1) {
                                          out.write(buf, 0, read)
                                          done += read
                                          if (total > 0) progress.value = ((done * 100) / total).toInt()
                                      }
                                  }
                              }
                          }
                          progress.value = 99
                          unzip(tmpZip, ctx)
                          tmpZip.delete()
                          status.value = if (isReady(ctx)) 2 else 3
                      } catch (_: Exception) {
                          status.value = 3
                      }
                  }.start()
              }

              private fun unzip(zip: File, ctx: Context) {
                  ZipInputStream(BufferedInputStream(zip.inputStream())).use { zis ->
                      var entry = zis.nextEntry
                      var root: String? = null
                      while (entry != null) {
                          if (root == null && entry.name.contains("/")) {
                              root = entry.name.substringBefore("/")
                          }
                          val out = File(ctx.filesDir, entry.name)
                          if (entry.isDirectory) {
                              out.mkdirs()
                          } else {
                              out.parentFile?.mkdirs()
                              FileOutputStream(out).use { zis.copyTo(it) }
                          }
                          entry = zis.nextEntry
                      }
                      if (root != null) {
                          val src = File(ctx.filesDir, root)
                          val dst = modelDir(ctx)
                          if (src.exists() && src.absolutePath != dst.absolutePath) {
                              if (dst.exists()) dst.deleteRecursively()
                              src.renameTo(dst)
                          }
                      }
                  }
              }
          }
          FIM_VOSK

          cat > app/src/main/java/com/atlas/assistant/VoiceOutput.kt << 'FIM_VOICE'
          package com.atlas.assistant

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          object VoiceOutput {
              private var tts: TextToSpeech? = null
              private var ready = false
              private var player: MediaPlayer? = null
              private val main = Handler(Looper.getMainLooper())
              private var appCtx: Context? = null

              data class Voz(val id: String, val label: String)

              val vozes = listOf(
                  Voz("pt-BR-AntonioNeural", "ANTONIO BR"),
                  Voz("pt-BR-FabioNeural", "FABIO BR"),
                  Voz("en-GB-RyanNeural", "RYAN UK"),
                  Voz("en-GB-ThomasNeural", "THOMAS UK")
              )

              fun init(context: Context) {
                  appCtx = context.applicationContext
                  if (tts == null) {
                      tts = TextToSpeech(context.applicationContext) { status ->
                          ready = status == TextToSpeech.SUCCESS
                          if (ready) pickVoice()
                      }
                  }
              }

              private fun prefs(ctx: Context) =
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE)

              fun azureKey(ctx: Context): String =
                  prefs(ctx).getString("az_key", "") ?: ""

              fun azureRegion(ctx: Context): String =
                  prefs(ctx).getString("az_region", "eastus") ?: "eastus"

              fun azureVoice(ctx: Context): String =
                  prefs(ctx).getString("az_voice", "pt-BR-AntonioNeural") ?: "pt-BR-AntonioNeural"

              fun saveAzure(ctx: Context, key: String, region: String, voice: String) {
                  prefs(ctx).edit()
                      .putString("az_key", key.trim())
                      .putString("az_region", region.trim())
                      .putString("az_voice", voice)
                      .apply()
              }

              fun voicePass(ctx: Context): String =
                  prefs(ctx).getString("voice_pass", "") ?: ""

              fun saveVoicePass(ctx: Context, s: String) {
                  prefs(ctx).edit().putString("voice_pass", s.trim()).apply()
              }

              fun bgListen(ctx: Context): Boolean =
                  prefs(ctx).getBoolean("bg_listen", true)

              fun saveBgListen(ctx: Context, b: Boolean) {
                  prefs(ctx).edit().putBoolean("bg_listen", b).apply()
              }

              private fun pickVoice() {
                  val t = tts ?: return
                  try {
                      val voices = t.voices
                      if (voices != null) {
                          val pt = voices.filter { v ->
                              v.locale.language == "pt" &&
                                  (v.locale.country == "BR" ||
                                   v.name.contains("BR", true) ||
                                   v.name.contains("brazil", true) ||
                                   v.name.contains("brasil", true))
                          }
                          val malePt = pt.firstOrNull {
                              Regex("ricardo|homer|male|masculin|joaquim|felipe",
                                  RegexOption.IGNORE_CASE).containsMatchIn(it.name)
                          }
                          val chosen = malePt ?: pt.firstOrNull()
                          if (chosen != null) {
                              t.voice = chosen
                              t.language = chosen.locale
                          } else {
                              val r = t.setLanguage(Locale("pt", "BR"))
                              if (r == TextToSpeech.LANG_MISSING_DATA ||
                                  r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                  t.setLanguage(Locale.getDefault())
                              }
                          }
                      } else {
                          val r = t.setLanguage(Locale("pt", "BR"))
                          if (r == TextToSpeech.LANG_MISSING_DATA ||
                              r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              t.setLanguage(Locale.getDefault())
                          }
                      }
                      t.setPitch(0.85f)
                      t.setSpeechRate(0.98f)
                  } catch (_: Exception) {
                      try { t.setLanguage(Locale.getDefault()) } catch (_: Exception) {}
                  }
              }

              fun stop() {
                  try { tts?.stop() } catch (_: Exception) {}
                  try { player?.stop(); player?.release() } catch (_: Exception) {}
                  player = null
              }

              fun speak(text: String, onDone: () -> Unit) {
                  val ctx = appCtx
                  if (ctx != null && azureKey(ctx).isNotBlank()) {
                      speakAzure(ctx, text, onDone)
                  } else {
                      speakDevice(text, onDone)
                  }
              }

              private fun speakDevice(text: String, onDone: () -> Unit) {
                  val t = tts
                  if (t == null || !ready) { main.post(onDone); return }
                  Bus.state.value = Bus.State.SPEAKING
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) {
                          main.post { Bus.state.value = Bus.State.IDLE; onDone() }
                      }
                      override fun onError(utteranceId: String?) {
                          main.post { Bus.state.value = Bus.State.IDLE; onDone() }
                      }
                  })
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, Bundle(), "atlas_${System.nanoTime()}")
              }

              private fun speakAzure(ctx: Context, text: String, onDone: () -> Unit) {
                  Bus.state.value = Bus.State.SPEAKING
                  Thread {
                      try {
                          val key = azureKey(ctx)
                          val region = azureRegion(ctx)
                          val voice = azureVoice(ctx)
                          val lang = if (voice.startsWith("pt")) "pt-BR" else "en-GB"
                          val ssml = "<speak version='1.0' xml:lang='$lang'><voice name='$voice'>$text</voice></speak>"
                          val c = URL("https://$region.tts.speech.microsoft.com/cognitiveservices/v1")
                              .openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.connectTimeout = 15000
                          c.readTimeout = 30000
                          c.doOutput = true
                          c.setRequestProperty("Ocp-Apim-Subscription-Key", key)
                          c.setRequestProperty("Content-Type", "application/ssml+xml")
                          c.setRequestProperty("X-Microsoft-OutputFormat", "audio-24khz-48kbitrate-mono-mp3")
                          c.outputStream.use { it.write(ssml.toByteArray(Charsets.UTF_8)) }
                          val code = c.responseCode
                          if (code !in 200..299) throw RuntimeException("HTTP $code")
                          val bytes = c.inputStream.use { it.readBytes() }
                          val f = File(ctx.cacheDir, "atlas_tts.mp3")
                          f.writeBytes(bytes)
                          main.post {
                              try {
                                  player?.release()
                                  player = MediaPlayer().apply {
                                      setAudioAttributes(
                                          AudioAttributes.Builder()
                                              .setUsage(AudioAttributes.USAGE_ASSISTANT)
                                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                              .build()
                                      )
                                      setDataSource(f.absolutePath)
                                      prepare()
                                      start()
                                      setOnCompletionListener {
                                          Bus.state.value = Bus.State.IDLE
                                          onDone()
                                      }
                                      setOnErrorListener { _, _, _ ->
                                          Bus.state.value = Bus.State.IDLE
                                          speakDevice(text, onDone)
                                          true
                                      }
                                  }
                              } catch (_: Exception) {
                                  speakDevice(text, onDone)
                              }
                          }
                      } catch (_: Exception) {
                          main.post { speakDevice(text, onDone) }
                      }
                  }.start()
              }
          }
          FIM_VOICE

          cat > app/src/main/java/com/atlas/assistant/AiTool.kt << 'FIM_AIT'
          package com.atlas.assistant

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.UnknownHostException

          object AiTool {

              data class P(
                  val id: String,
                  val label: String,
                  val url: String,
                  val defaultModel: String,
                  val isGemini: Boolean
              )

              data class AiAnswer(val ok: Boolean, val text: String)

              val providers = listOf(
                  P("groq", "GROQ", "https://api.groq.com/openai/v1/chat/completions", "llama-3.3-70b-versatile", false),
                  P("openai", "OPENAI", "https://api.openai.com/v1/chat/completions", "gpt-4o-mini", false),
                  P("openrouter", "OPENROUTER", "https://openrouter.ai/api/v1/chat/completions", "meta-llama/llama-3.3-70b-instruct:free", false),
                  P("gemini", "GEMINI", "https://generativelanguage.googleapis.com/v1beta/models/", "gemini-1.5-flash", true)
              )

              private const val SYS = "Voce e o ATLAS, um assistente pessoal de voz no estilo do Jarvis do Homem de Ferro. Responda sempre em portugues do Brasil, com no maximo 3 frases, de forma elegante, direta e util, tratando o usuario como senhor."

              private fun prefs(ctx: Context) =
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE)

              fun activeId(ctx: Context): String? =
                  prefs(ctx).getString("ai_active", null)

              fun isConfigured(ctx: Context): Boolean {
                  val id = activeId(ctx) ?: return false
                  return getKey(ctx, id).isNotBlank()
              }

              fun isTested(ctx: Context): Boolean =
                  prefs(ctx).getBoolean("ai_tested", false)

              fun setTested(ctx: Context, ok: Boolean) {
                  prefs(ctx).edit().putBoolean("ai_tested", ok).apply()
              }

              fun save(ctx: Context, id: String, key: String, model: String) {
                  prefs(ctx).edit()
                      .putString("key_$id", key)
                      .putString("model_$id", model)
                      .putString("ai_active", id)
                      .putBoolean("ai_tested", false)
                      .apply()
              }

              fun getKey(ctx: Context, id: String): String =
                  prefs(ctx).getString("key_$id", "") ?: ""

              fun getModel(ctx: Context, id: String): String {
                  val d = providers.firstOrNull { it.id == id }?.defaultModel ?: ""
                  return prefs(ctx).getString("model_$id", d) ?: d
              }

              suspend fun ask(ctx: Context, prompt: String): AiAnswer = withContext(Dispatchers.IO) {
                  val id = activeId(ctx)
                      ?: return@withContext AiAnswer(false, "Nenhuma IA selecionada.")
                  val p = providers.firstOrNull { it.id == id }
                      ?: return@withContext AiAnswer(false, "IA desconhecida.")
                  val key = getKey(ctx, id)
                  if (key.isBlank()) return@withContext AiAnswer(false, "A chave esta vazia.")
                  val model = getModel(ctx, id)
                  try {
                      val resp = if (p.isGemini) askGemini(p, key, model, prompt) else askOpenAi(p, key, model, prompt)
                      if (resp.isBlank()) AiAnswer(false, "A IA respondeu vazio.")
                      else AiAnswer(true, resp)
                  } catch (e: UnknownHostException) {
                      AiAnswer(false, "Sem internet ou servidor inacessivel.")
                  } catch (e: Exception) {
                      val msg = e.message ?: "Erro desconhecido."
                      if (msg.contains("404") && !p.isGemini) {
                          autoRepair(ctx, p, key, prompt)
                      } else {
                          AiAnswer(false, msg)
                      }
                  }
              }

              private fun autoRepair(ctx: Context, p: P, key: String, prompt: String): AiAnswer {
                  val models = listModels(p, key)
                  val chosen = pickChatModel(models)
                      ?: return AiAnswer(false, "O modelo antigo saiu do ar e nao encontrei substituto.")
                  return try {
                      val resp = askOpenAi(p, key, chosen, prompt)
                      if (resp.isBlank()) {
                          AiAnswer(false, "Troquei para o modelo $chosen mas ele respondeu vazio.")
                      } else {
                          prefs(ctx).edit().putString("model_${p.id}", chosen).apply()
                          AiAnswer(true, resp)
                      }
                  } catch (e: Exception) {
                      AiAnswer(false, "Falhei mesmo trocando de modelo: ${e.message}")
                  }
              }

              private fun listModels(p: P, key: String): List<String> {
                  return try {
                      val modelsUrl = p.url.substringBefore("/chat/completions") + "/models"
                      val c = URL(modelsUrl).openConnection() as HttpURLConnection
                      c.requestMethod = "GET"
                      c.connectTimeout = 15000
                      c.readTimeout = 20000
                      c.setRequestProperty("Authorization", "Bearer $key")
                      if (c.responseCode in 200..299) {
                          val json = JSONObject(c.inputStream.bufferedReader().use { it.readText() })
                          val arr = json.optJSONArray("data") ?: return emptyList()
                          (0 until arr.length()).mapNotNull { i ->
                              arr.optJSONObject(i)?.optString("id")
                          }.filter { it.isNotBlank() }
                      } else emptyList()
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              private fun pickChatModel(models: List<String>): String? {
                  val bad = listOf("whisper", "tts", "playai", "guard", "distil", "embed", "moderation", "prompt")
                  val chat = models.filter { m -> bad.none { m.lowercase().contains(it) } }
                  return chat.firstOrNull { it.lowercase().contains("llama-3.3") }
                      ?: chat.firstOrNull { it.lowercase().contains("llama") }
                      ?: chat.firstOrNull { it.lowercase().contains("gpt-oss") }
                      ?: chat.firstOrNull { it.lowercase().contains("qwen") }
                      ?: chat.firstOrNull()
              }

              private fun askOpenAi(p: P, key: String, model: String, prompt: String): String {
                  val body = JSONObject()
                  body.put("model", model)
                  body.put("max_tokens", 300)
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", SYS))
                  msgs.put(JSONObject().put("role", "user").put("content", prompt))
                  body.put("messages", msgs)
                  val resp = post(p.url, body, "Authorization" to "Bearer $key")
                  return JSONObject(resp)
                      .getJSONArray("choices").getJSONObject(0)
                      .getJSONObject("message").getString("content").trim()
              }

              private fun askGemini(p: P, key: String, model: String, prompt: String): String {
                  val url = p.url + model + ":generateContent?key=" + key
                  val body = JSONObject()
                  val part = JSONObject().put("text", prompt)
                  val contents = JSONArray().put(JSONObject().put("parts", JSONArray().put(part)))
                  body.put("contents", contents)
                  val resp = post(url, body, null)
                  return JSONObject(resp)
                      .getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                      .getString("text").trim()
              }

              private fun post(url: String, body: JSONObject, auth: Pair<String, String>?): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  if (auth != null) c.setRequestProperty(auth.first, auth.second)
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  if (code == 401) throw RuntimeException("Chave invalida ou expirada (401).")
                  if (code == 429) throw RuntimeException("Limite de uso atingido (429).")
                  if (code !in 200..299) throw RuntimeException("Erro HTTP $code")
                  return c.inputStream.bufferedReader().use { it.readText() }
              }
          }
