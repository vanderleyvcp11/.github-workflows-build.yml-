                  val n = buildNotification()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  else startForeground(1, n)
                  tone = ToneGenerator(AudioManager.STREAM_MUSIC, 90)
                  VoiceOutput.init(applicationContext)
                  try { LibVosk.setLogLevel(LogLevel.WARNINGS) } catch (_: Exception) {}
                  VoskSpeech.refresh(applicationContext)
                  scope.launch {
                      VoskSpeech.status.collect { st ->
                          if (st == 2 && !running) startLoop()
                      }
                  }
                  scope.launch {
                      Bus.paused.collect { p ->
                          if (p) {
                              activated = false
                              Bus.state.value = Bus.State.IDLE
                              updateNotification("Em modo descanso. Toque no app para acordar.")
                          } else {
                              updateNotification("Diga \"Jarvis\" para despertar (offline).")
                          }
                      }
                  }
                  if (VoskSpeech.isReady(this)) startLoop()
                  else updateNotification("Abra o app e instale o cerebro de voz (46MB).")
              }

              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                      .createNotificationChannel(NotificationChannel("atlas", "ATLAS", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, "atlas")
                      .setSmallIcon(R.drawable.ic_reactor)
                      .setContentTitle("ATLAS ativo")
                      .setContentText("Diga \"Jarvis\" para despertar.")
                      .setOngoing(true).setContentIntent(pi)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build()
              }

              private fun updateNotification(text: String) {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(1, NotificationCompat.Builder(this, "atlas")
                      .setSmallIcon(R.drawable.ic_reactor)
                      .setContentTitle(if (Bus.paused.value) "ATLAS em descanso" else "ATLAS ativo")
                      .setContentText(text)
                      .setOngoing(true).setContentIntent(pi)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build())
              }

              /** Loop de escuta 100% offline com Vosk — sem servidores, sem reconexoes. */
              private fun startLoop() {
                  if (running) return
                  running = true
                  Thread {
                      var audio: AudioRecord? = null
                      var rec: Recognizer? = null
                      try {
                          val sr = 16000
                          val minBuf = AudioRecord.getMinBufferSize(
                              sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                          )
                          audio = AudioRecord(
                              MediaRecorder.AudioSource.MIC, sr,
                              AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT,
                              minBuf * 4
                          )
                          rec = Recognizer(VoskSpeech.model(this), sr.toFloat())
                          audio.startRecording()
                          val buf = ByteArray(8192)
                          while (running) {
                              val st = Bus.state.value
                              if (Bus.paused.value || !VoiceOutput.bgListen(this) ||
                                  st == Bus.State.SPEAKING || st == Bus.State.PROCESSING) {
                                  audio.read(buf, 0, buf.size)
                                  continue
                              }
                              val n = audio.read(buf, 0, buf.size)
                              if (n <= 0) continue
                              if (rec.acceptWaveForm(buf, n)) {
                                  val text = JSONObject(rec.result).optString("text").trim()
                                  if (text.isNotBlank()) processFinal(text)
                              } else {
                                  val p = JSONObject(rec.partialResult).optString("partial")
                                  if (p.isNotBlank()) Bus.heard.value = p
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { audio?.stop(); audio?.release() } catch (_: Exception) {}
                          try { rec?.close() } catch (_: Exception) {}
                      }
                  }.start()
              }

              private fun containsWake(t: String): Boolean =
                  wakeWords.any { t.lowercase().contains(it) }

              private fun stripWake(t: String): String {
                  val low = t.lowercase()
                  for (w in wakeWords) {
                      val idx = low.indexOf(w)
                      if (idx >= 0) {
                          return t.substring((idx + w.length)).trim(' ', ',', '.', '!', '?')
                      }
                  }
                  return t
              }

              private fun processFinal(text: String) {
                  val now = System.currentTimeMillis()
                  if (activated) {
                      if (now - lastActivation < 15000) {
                          handler.post { handleCommand(text) }
                      } else {
                          activated = false
                          Bus.state.value = Bus.State.IDLE
                      }
                  } else if (containsWake(text)) {
                      val rest = stripWake(text)
                      tone?.startTone(ToneGenerator.TONE_PROP_BEEP, 150)
                      if (rest.isNotBlank() && rest.length > 2) {
                          handler.post { handleCommand(rest) }
                      } else {
                          activated = true
                          lastActivation = now
                          Bus.state.value = Bus.State.LISTENING
                          Bus.heard.value = ""
                      }
                  }
              }

              private fun handleCommand(text: String) {
                  val pass = VoiceOutput.voicePass(this)
                  if (pass.isNotBlank() && !text.lowercase().contains(pass.lowercase())) {
                      Bus.heard.value = text
                      Bus.reply.value = "Comando de voz não autorizado, senhor. Diga a frase secreta."
                      Bus.add(text, Bus.reply.value)
                      VoiceOutput.speak(Bus.reply.value) {
                          activated = false
                          Bus.state.value = Bus.State.IDLE
                      }
                      return
                  }
                  Bus.heard.value = text
                  Bus.state.value = Bus.State.PROCESSING
                  scope.launch {
                      val answer = AtlasBrain.handle(applicationContext, text)
                      Bus.reply.value = answer
                      Bus.add(text, answer)
                      VoiceOutput.speak(answer) {
                          activated = false
                          Bus.state.value = Bus.State.IDLE
                      }
                  }
              }

              override fun onDestroy() {
                  running = false
                  tone?.release()
                  handler.removeCallbacksAndMessages(null)
                  scope.cancel()
                  super.onDestroy()
              }
          }
          FIM_SERVICE

