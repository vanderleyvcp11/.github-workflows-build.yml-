              private fun battery(ctx: Context): String {
                  val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val charging = bm.isCharging
