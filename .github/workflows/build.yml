              private fun buildNotification(): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                      .createNotificationChannel(NotificationChannel("atlas", "ATLAS", NotificationManager.IMPORTANCE_LOW))
                  return NotificationCompat.Builder(this, "atlas")
                      .setSmallIcon(R.drawable.ic_reactor)
                      .setContentTitle("ATLAS ativo")
                      .setContentText("Diga \"Jarvis\" para despertar.")
                      .setOngoing(true).setContentIntent(pi)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build()
              }

              private fun updateNotification(text: String) {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(1, NotificationCompat.Builder(this, "atlas")
                      .setSmallIcon(R.drawable.ic_reactor)
                      .setContentTitle(if (Bus.paused.value) "ATLAS em descanso" else "ATLAS ativo")
                      .setContentText(text)
                      .setOngoing(true).setContentIntent(pi)
                      .setCategory(Notification.CATEGORY_SERVICE)
                      .build())
              }

              private fun startListening() {
                  if (Bus.paused.value) return
                  try { recognizer?.destroy() } catch (_: Exception) {}
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(this@AtlasService)
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toLanguageTag())
                          putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      }
                      try { startListening(i) } catch (_: Exception) {
                          handler.postDelayed({ startListening() }, 2000)
                      }
                  }
              }

              private fun containsWake(t: String) = wakeWords.any { t.lowercase().contains(it) }

              private fun activate() {
                  if (activated || Bus.paused.value) return
                  activated = true
                  lastActivation = System.currentTimeMillis()
                  Bus.state.value = Bus.State.LISTENING
                  tone?.startTone(ToneGenerator.TONE_PROP_BEEP, 150)
                  recognizer?.stopListening()
                  handler.postDelayed({ startListening() }, 250)
                  handler.postDelayed(commandTimeout, 8000)
              }

              private fun handleCommand(text: String) {
                  handler.removeCallbacks(commandTimeout)
                  Bus.heard.value = text
                  Bus.state.value = Bus.State.PROCESSING
                  scope.launch {
                      val answer = AtlasBrain.handle(applicationContext, text)
                      Bus.reply.value = answer
                      Bus.add(text, answer)
                      VoiceOutput.speak(answer) {
                          activated = false
                          Bus.state.value = Bus.State.IDLE
                          handler.post { startListening() }
                      }
                  }
              }

              override fun onPartialResults(partial: Bundle?) {
                  val t = partial?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: return
                  if (!activated && containsWake(t)) activate()
              }

              override fun onResults(results: Bundle?) {
                  val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull().orEmpty()
                  when {
                      activated && t.isNotBlank() -> handleCommand(t)
                      !activated && containsWake(t) -> activate()
                      else -> handler.postDelayed({ startListening() }, 300)
                  }
              }

              override fun onError(error: Int) {
                  if (Bus.paused.value) return
                  if (activated && System.currentTimeMillis() - lastActivation > 8000) {
                      activated = false
                      Bus.state.value = Bus.State.IDLE
                  }
                  val delay = when (error) {
                      SpeechRecognizer.ERROR_SPEECH_TIMEOUT, SpeechRecognizer.ERROR_NO_MATCH -> 300L
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> 1000L
                      else -> 1500L
                  }
                  handler.postDelayed({ startListening() }, delay)
              }

              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onRmsChanged(rmsdB: Float) {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() {}
              override fun onEvent(eventType: Int, params: Bundle?) {}

              override fun onDestroy() {
                  recognizer?.destroy(); tone?.release()
                  handler.removeCallbacksAndMessages(null)
                  scope.cancel()
                  super.onDestroy()
              }
          }
