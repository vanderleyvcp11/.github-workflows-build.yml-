          @Composable
          private fun PanelBox(content: @Composable () -> Unit) {
              Box(
                  Modifier
                      .fillMaxWidth()
                      .border(1.dp, NEON_DEEP.copy(alpha = 0.55f), RoundedCornerShape(14.dp))
                      .background(PANEL, RoundedCornerShape(14.dp))
                      .padding(8.dp)
              ) { content() }
          }

          @Composable
          fun HudScreen(onSend: (String) -> Unit) {
              val ctx = LocalContext.current
              val state by Bus.state.collectAsState()
              val paused by Bus.paused.collectAsState()
              val heard by Bus.heard.collectAsState()
              val reply by Bus.reply.collectAsState()
              val log by Bus.log.collectAsState()
              var input by remember { mutableStateOf("") }
              var showAi by remember { mutableStateOf(false) }
              var showVoz by remember { mutableStateOf(false) }
              var aiActive by remember { mutableStateOf(AiTool.activeId(ctx)) }
              var batt by remember { mutableStateOf(0.6f) }
              var temp by remember { mutableStateOf(30f) }
              var clock by remember { mutableStateOf("--:--:--") }
              val listState = rememberLazyListState()

              LaunchedEffect(Unit) {
                  while (true) {
                      val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      val lvl = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                      if (lvl > 0) batt = lvl / 100f
                      try {
                          val stick = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          val tRaw = stick?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0
                          if (tRaw > 0) temp = tRaw / 10f
                      } catch (_: Exception) {}
                      clock = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      delay(1000)
                  }
              }
              LaunchedEffect(log.size) { if (log.isNotEmpty()) listState.animateScrollToItem(0) }

              Column(
                  Modifier.fillMaxSize().background(BG)
                      .verticalScroll(rememberScrollState())
                      .padding(10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Column(Modifier.weight(1f)) {
                          Text("ATLAS", style = TextStyle(
                              color = NEON, fontSize = 30.sp, letterSpacing = 12.sp,
                              shadow = Shadow(NEON, Offset.Zero, 16f)
                          ))
                          Text(
                              if (paused) "MODO DESCANSO" else statusText(state),
                              color = if (paused) AMBER else statusColor(state),
                              fontSize = 10.sp, letterSpacing = 3.sp
                          )
                      }
                      Column(horizontalAlignment = Alignment.End) {
                          Text(clock, color = NEON, fontSize = 18.sp, style = TextStyle(
                              shadow = Shadow(NEON_DEEP, Offset.Zero, 10f)
                          ))
                          Text("SISTEMA ONLINE", color = GREEN, fontSize = 9.sp, letterSpacing = 2.sp)
                      }
                  }
                  Spacer(Modifier.height(8.dp))

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Box(Modifier.weight(1f)) { Gauge("BATERIA", batt, "${(batt * 100).toInt()}%") }
                      Box(Modifier.weight(1f)) { Gauge("TEMP", (temp / 60f).coerceIn(0f, 1f), "${temp.toInt()}°C") }
                  }
                  Spacer(Modifier.height(6.dp))

                  Box(Modifier.fillMaxWidth().height(310.dp), contentAlignment = Alignment.Center) {
                      ReactorCore(
                          Modifier.size(290.dp),
                          active = !paused
                      )
                  }
                  Spacer(Modifier.height(6.dp))

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Box(Modifier.weight(1f)) { PanelBox { SpectrumPanel() } }
                      Box(Modifier.weight(1f)) {
                          PanelBox {
                              val aiLabel = AiTool.providers.firstOrNull { it.id == aiActive }?.label ?: "LOCAL"
                              Column {
                                  StatusLine("[STATUS] SISTEMAS OK", 0)
                                  StatusLine("[AUDIO] VOZ ATIVA", 1)
                                  StatusLine(
                                      if (paused) "[MODO] DESCANSO" else "[MODO] ESCUTANDO",
                                      2
                                  )
                                  StatusLine("[REDE] IA: $aiLabel", 3)
                                  StatusLine("[DADOS] EM TEMPO REAL", 4)
                              }
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))

                  PanelBox {
                      Text(
                          heard.ifEmpty { "Aguardando comando..." },
                          color = NEON.copy(alpha = 0.85f), fontSize = 12.sp
                      )
                      Text(
                          reply.ifEmpty { "ATLAS ONLINE. TODOS OS SISTEMAS CARREGADOS E PRONTOS PARA USO, SENHOR." },
                          color = GOLD, fontSize = 13.sp
                      )
                  }
                  Spacer(Modifier.height(6.dp))

                  Box(Modifier.fillMaxWidth().height(130.dp)) {
                      LazyColumn(state = listState, modifier = Modifier.fillMaxSize()) {
                          items(log.size) { i ->
                              val (u, a) = log[i]
                              Text("VOCE: $u", color = NEON, fontSize = 12.sp)
                              Text("ATLAS: $a", color = GOLD, fontSize = 12.sp)
                              Spacer(Modifier.height(5.dp))
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))

                  Row(verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = input, onValueChange = { input = it },
                          modifier = Modifier.weight(1f),
                          placeholder = { Text("Digite um comando...", color = Color(0xFF3B4C5C), fontSize = 13.sp) }
                      )
                      Spacer(Modifier.width(8.dp))
                      RoundButton("ENVIAR") {
                          if (input.isNotBlank()) { onSend(input.trim()); input = "" }
                      }
                  }
                  Spacer(Modifier.height(8.dp))

                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                          RoundButton(if (paused) "ACORDAR" else "DESCANSO") {
                              val p = !Bus.paused.value
                              Bus.paused.value = p
                              if (p) VoiceOutput.stop()
                          }
                      }
                      Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                          RoundButton("IA") { showAi = true }
                      }
                      Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                          RoundButton("VOZ") { showVoz = true }
                      }
                      Box(Modifier.weight(1f), contentAlignment = Alignment.Center) {
                          RoundButton("TESTE") {
                              VoiceOutput.speak("ATLAS operacional em portugues. Todos os sistemas nominais, senhor.") {}
                          }
                      }
                  }
              }

              if (showAi) {
                  AiDialog(onClose = {
                      showAi = false
                      aiActive = AiTool.activeId(ctx)
                  })
              }
              if (showVoz) {
                  VozDialog(onClose = { showVoz = false })
              }
          }

          private fun statusText(s: Bus.State) = when (s) {
              Bus.State.IDLE -> "SISTEMA ATIVO"
              Bus.State.LISTENING -> "OUVINDO..."
              Bus.State.PROCESSING -> "PROCESSANDO..."
              Bus.State.SPEAKING -> "RESPONDENDO..."
          }

          private fun statusColor(s: Bus.State) = when (s) {
              Bus.State.IDLE -> GREEN
              Bus.State.LISTENING -> NEON
              Bus.State.PROCESSING -> AMBER
              Bus.State.SPEAKING -> GREEN
          }

          @Composable
          private fun Gauge(label: String, value: Float, text: String) {
              val p by animateFloatAsState(targetValue = value, tween(900), label = "g")
              val pulse by rememberInfiniteTransition(label = "gp").animateFloat(
                  0.85f, 1f,
                  infiniteRepeatable(tween(1400, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "gpl"
              )
              Box(Modifier.fillMaxWidth().height(110.dp), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.size(104.dp).graphicsLayer { scaleX = pulse; scaleY = pulse }) {
                      val r = size.minDimension / 2f - 6f
                      val c = center
                      val start = 135f
                      val sweep = 270f
                      drawArc(NEON_DARK.copy(alpha = 0.8f), start, sweep, false,
                          topLeft = Offset(c.x - r, c.y - r), size = Size(r * 2, r * 2),
                          style = Stroke(9f, cap = StrokeCap.Round))
                      drawArc(NEON, start, sweep * p, false,
                          topLeft = Offset(c.x - r, c.y - r), size = Size(r * 2, r * 2),
                          style = Stroke(9f, cap = StrokeCap.Round))
                      drawArc(RED.copy(alpha = 0.9f), start + sweep * p,
                          (sweep * (1f - p)).coerceAtLeast(2f), false,
                          topLeft = Offset(c.x - r, c.y - r), size = Size(r * 2, r * 2),
                          style = Stroke(9f, cap = StrokeCap.Round))
                  }
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(text, color = NEON, fontSize = 17.sp, style = TextStyle(
                          shadow = Shadow(NEON_DEEP, Offset.Zero, 8f)))
                      Text(label, color = NEON.copy(alpha = 0.6f), fontSize = 9.sp, letterSpacing = 2.sp)
                  }
              }
          }

          @Composable
          private fun ReactorCore(modifier: Modifier, active: Boolean) {
              val t1 = rememberInfiniteTransition(label = "r1")
              val slow by t1.animateFloat(0f, 360f, infiniteRepeatable(tween(30000, easing = LinearEasing)), label = "s1")
              val mid by t1.animateFloat(360f, 0f, infiniteRepeatable(tween(20000, easing = LinearEasing)), label = "s2")
              val fast by t1.animateFloat(0f, 360f, infiniteRepeatable(tween(9000, easing = LinearEasing)), label = "s3")
              val sweepA by t1.animateFloat(0f, 360f, infiniteRepeatable(tween(5000, easing = LinearEasing)), label = "s4")
              val core by t1.animateFloat(0.55f, 1f, infiniteRepeatable(tween(1600, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "s5")

              Canvas(modifier) {
                  val r = size.minDimension / 2f
                  val c = center
                  rotate(slow, pivot = c) {
                      repeat(60) { i ->
                          val a = i * 6f
                          val len = if (i % 5 == 0) 10f else 5f
                          drawLine(
                              NEON.copy(alpha = 0.75f),
                              Offset(c.x + cos(Math.toRadians(a.toDouble())).toFloat() * (r - len),
                                  c.y + sin(Math.toRadians(a.toDouble())).toFloat() * (r - len)),
                              Offset(c.x + cos(Math.toRadians(a.toDouble())).toFloat() * r,
                                  c.y + sin(Math.toRadians(a.toDouble())).toFloat() * r),
                              strokeWidth = if (i % 5 == 0) 2.4f else 1.4f
                          )
                      }
                  }
                  drawCircle(NEON.copy(alpha = 0.5f), radius = r * 0.86f, center = c, style = Stroke(1.6f))
                  drawCircle(NEON_DEEP.copy(alpha = 0.5f), radius = r * 0.80f, center = c, style = Stroke(5f))
                  rotate(mid, pivot = c) {
                      repeat(24) { i ->
                          drawArc(NEON.copy(alpha = 0.6f), i * 15f + 4f, 8f, false,
                              topLeft = Offset(c.x - r * 0.70f, c.y - r * 0.70f),
                              size = Size(r * 1.4f, r * 1.4f), style = Stroke(7f))
                      }
                  }
                  drawCircle(NEON.copy(alpha = 0.35f), radius = r * 0.56f, center = c, style = Stroke(1.4f))
                  rotate(fast, pivot = c) {
                      repeat(12) { i ->
                          drawArc(NEON.copy(alpha = 0.8f), i * 30f + 6f, 14f, false,
                              topLeft = Offset(c.x - r * 0.46f, c.y - r * 0.46f),
                              size = Size(r * 0.92f, r * 0.92f), style = Stroke(4f))
                      }
                  }
                  rotate(sweepA, pivot = c) {
                      drawArc(
                          Brush.sweepGradient(listOf(NEON.copy(alpha = 0.30f), Color.Transparent), center = c),
                          0f, 100f, true,
                          topLeft = Offset(c.x - r * 0.54f, c.y - r * 0.54f),
                          size = Size(r * 1.08f, r * 1.08f)
                      )
                  }
                  val glow = if (active) core else core * 0.4f
                  drawCircle(Brush.radialGradient(
                      listOf(Color.White.copy(alpha = 0.95f * glow), NEON.copy(alpha = 0.8f * glow), Color.Transparent),
                      center = c, radius = r * 0.34f), radius = r * 0.34f, center = c)
                  drawCircle(NEON.copy(alpha = glow), radius = r * 0.22f, center = c, style = Stroke(2.5f))
                  val tri = androidx.compose.ui.graphics.Path().apply {
                      moveTo(c.x, c.y - r * 0.10f)
                      lineTo(c.x + r * 0.09f, c.y + r * 0.06f)
                      lineTo(c.x - r * 0.09f, c.y + r * 0.06f)
                      close()
                  }
                  drawPath(tri, Color.White.copy(alpha = 0.9f * glow))
              }
          }

          @Composable
          private fun SpectrumPanel() {
              val t = rememberInfiniteTransition(label = "spec")
              val phase by t.animateFloat(0f, 6.2831853f, infiniteRepeatable(tween(3200, easing = LinearEasing)), label = "ph")
              Column {
                  Text("DIAGNOSTICO DE SISTEMA", color = NEON.copy(alpha = 0.6f), fontSize = 9.sp, letterSpacing = 1.sp)
                  Spacer(Modifier.height(6.dp))
                  Canvas(Modifier.fillMaxWidth().height(64.dp)) {
                      val n = 12
                      val gap = 4f
                      val bw = (size.width - gap * (n - 1)) / n
                      for (i in 0 until n) {
                          val h = size.height * (0.15f + 0.8f * abs(
                              sin(i * 0.9 + phase * 4.0).toFloat() * cos(i * 1.7 + phase * 2.3).toFloat()
                          ))
                          drawRoundRect(
                              Brush.verticalGradient(
                                  listOf(NEON, NEON_DEEP),
                                  startY = size.height - h, endY = size.height
                              ),
                              topLeft = Offset(i * (bw + gap), size.height - h),
                              size = Size(bw, h),
                              cornerRadius = CornerRadius(3f, 3f)
                          )
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  LoaderRow("NUCLEO", (abs(sin(phase * 2.0).toFloat()) * 0.7f + 0.3f))
                  LoaderRow("REDE", (abs(cos(phase * 1.4).toFloat()) * 0.7f + 0.3f))
              }
          }

          @Composable
          private fun LoaderRow(label: String, frac: Float) {
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Text(label, color = NEON.copy(alpha = 0.5f), fontSize = 8.sp, modifier = Modifier.width(46.dp))
                  Box(
                      Modifier
                          .weight(1f)
                          .height(3.dp)
                          .background(NEON_DARK, RoundedCornerShape(2.dp))
                  ) {
                      Box(
                          Modifier
                              .fillMaxWidth(frac.coerceIn(0.05f, 1f))
                              .height(3.dp)
                              .background(NEON, RoundedCornerShape(2.dp))
                      )
                  }
              }
          }

          @Composable
          private fun StatusLine(text: String, index: Int) {
              val t = rememberInfiniteTransition(label = "sl$index")
              val dot by t.animateFloat(
                  0.35f, 1f,
                  infiniteRepeatable(tween(1200 + index * 150, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "d$index"
              )
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Canvas(Modifier.size(6.dp)) {
                      drawCircle(GREEN.copy(alpha = dot), radius = size.minDimension / 2f)
                  }
                  Spacer(Modifier.width(5.dp))
                  Text(text, color = NEON.copy(alpha = 0.85f), fontSize = 9.sp, letterSpacing = 0.5.sp)
              }
          }

          @Composable
          private fun RoundButton(label: String, onClick: () -> Unit) {
              val t = rememberInfiniteTransition(label = "rb$label")
              val rot by t.animateFloat(0f, 360f, infiniteRepeatable(tween(10000, easing = LinearEasing)), label = "rbr")
              val glow by t.animateFloat(0.6f, 1f, infiniteRepeatable(tween(1500, easing = FastOutSlowInEasing), RepeatMode.Reverse), label = "rbg")
              Box(
                  Modifier
                      .size(62.dp)
                      .border(1.5.dp, NEON.copy(alpha = 0.5f * glow), CircleShape)
                      .background(PANEL, CircleShape)
                      .clickable { onClick() },
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(Modifier.size(58.dp).graphicsLayer { rotationZ = rot }) {
                      val r = size.minDimension / 2f - 2f
                      val c = center
                      repeat(12) { i ->
                          drawArc(
                              NEON.copy(alpha = 0.55f), i * 30f + 5f, 14f, false,
                              topLeft = Offset(c.x - r, c.y - r), size = Size(r * 2, r * 2),
                              style = Stroke(1.6f)
                          )
                      }
                  }
                  Text(label, color = NEON, fontSize = 9.sp, letterSpacing = 0.5.sp, textAlign = TextAlign.Center)
              }
          }

          @Composable
          private fun AiDialog(onClose: () -> Unit) {
              val ctx = LocalContext.current
              var selected by remember { mutableStateOf(AiTool.activeId(ctx) ?: "groq") }
              var key by remember { mutableStateOf(AiTool.getKey(ctx, selected)) }
              var model by remember { mutableStateOf(AiTool.getModel(ctx, selected)) }

              AlertDialog(
                  onDismissRequest = onClose,
                  confirmButton = {
                      TextButton(onClick = {
                          AiTool.save(ctx, selected, key.trim(), model.trim())
                          onClose()
                      }) { Text("SALVAR") }
                  },
                  dismissButton = { TextButton(onClick = onClose) { Text("FECHAR") } },
                  title = { Text("INTELIGENCIAS", color = NEON, fontSize = 18.sp) },
                  text = {
                      Column {
                          Text(
                              "Escolha a IA e cole sua chave. Groq e gratuita em console.groq.com. OpenRouter tem modelos gratis.",
                              color = Color(0xFF9FB3C8), fontSize = 12.sp
                          )
                          Spacer(Modifier.height(10.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                              AiTool.providers.forEach { p ->
                                  Button(
                                      onClick = {
                                          selected = p.id
                                          key = AiTool.getKey(ctx, p.id)
                                          model = AiTool.getModel(ctx, p.id)
                                      },
                                      colors = if (selected == p.id)
                                          ButtonDefaults.buttonColors(containerColor = NEON_DEEP)
                                      else ButtonDefaults.buttonColors(containerColor = Color(0xFF0E3A4D)),
                                      contentPadding = androidx.compose.foundation.layout.PaddingValues(6.dp)
                                  ) { Text(p.label, fontSize = 10.sp) }
                              }
                          }
                          Spacer(Modifier.height(10.dp))
                          OutlinedTextField(
                              value = key, onValueChange = { key = it },
                              label = { Text("Chave de API") },
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(Modifier.height(6.dp))
                          OutlinedTextField(
                              value = model, onValueChange = { model = it },
                              label = { Text("Modelo") },
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                  }
              )
          }

