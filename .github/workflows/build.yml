                  Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) { Reactor(state) }
                  Spacer(Modifier.height(4.dp))
                  Text(heard.ifEmpty { "Aguardando wake word..." },
                      color = CYAN.copy(alpha = 0.8f), fontSize = 15.sp, textAlign = TextAlign.Center)
                  Text(reply, color = GOLD, fontSize = 16.sp, textAlign = TextAlign.Center)
                  Spacer(Modifier.height(12.dp))

                  LazyColumn(Modifier.weight(1f).fillMaxWidth(), state = listState) {
                      items(log.size) { i ->
                          val (u, a) = log[i]
                          Text("COMANDO: $u", color = CYAN, fontSize = 14.sp)
                          Text(a, color = GOLD, fontSize = 14.sp)
                          Spacer(Modifier.height(8.dp))
