          object Bus {
              enum class State { IDLE, LISTENING, PROCESSING, SPEAKING }
              val state = MutableStateFlow(State.IDLE)
              val paused = MutableStateFlow(false)
              val heard = MutableStateFlow("")
              val reply = MutableStateFlow("")
              val log = MutableStateFlow<List<Pair<String, String>>>(emptyList())
