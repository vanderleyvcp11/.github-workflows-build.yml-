          object Atlas {
              lateinit var appCtx: Context
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              fun ask(text: String) {
                  if (!::appCtx.isInitialized) return
                  Bus.heard.value = text
                  Bus.state.value = Bus.State.PROCESSING
                  scope.launch {
                      val answer = AtlasBrain.handle(appCtx, text)
                      Bus.reply.value = answer
                      Bus.add(text, answer)
                      VoiceOutput.speak(answer) { Bus.state.value = Bus.State.IDLE }
                  }
              }
