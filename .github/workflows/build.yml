          cat > app/src/main/java/com/atlas/assistant/VoiceOutput.kt << 'FIM_VOICE'
          package com.atlas.assistant

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          object VoiceOutput {
              private var tts: TextToSpeech? = null
              private var ready = false
              private var player: MediaPlayer? = null
              private val main = Handler(Looper.getMainLooper())
              private var appCtx: Context? = null

              data class Voz(val id: String, val label: String)

              val vozes = listOf(
                  Voz("pt-BR-AntonioNeural", "ANTONIO BR"),
                  Voz("pt-BR-FabioNeural", "FABIO BR"),
                  Voz("en-GB-RyanNeural", "RYAN UK"),
                  Voz("en-GB-ThomasNeural", "THOMAS UK")
              )

              fun init(context: Context) {
                  appCtx = context.applicationContext
                  if (tts == null) {
                      tts = TextToSpeech(context.applicationContext) { status ->
                          ready = status == TextToSpeech.SUCCESS
                          if (ready) pickVoice()
                      }
                  }
              }

              private fun prefs(ctx: Context) =
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE)

              fun azureKey(ctx: Context): String =
                  prefs(ctx).getString("az_key", "") ?: ""

              fun azureRegion(ctx: Context): String =
                  prefs(ctx).getString("az_region", "eastus") ?: "eastus"

              fun azureVoice(ctx: Context): String =
                  prefs(ctx).getString("az_voice", "pt-BR-AntonioNeural") ?: "pt-BR-AntonioNeural"

              fun saveAzure(ctx: Context, key: String, region: String, voice: String) {
                  prefs(ctx).edit()
                      .putString("az_key", key.trim())
                      .putString("az_region", region.trim())
                      .putString("az_voice", voice)
                      .apply()
              }

              private fun pickVoice() {
                  val t = tts ?: return
                  try {
                      val voices = t.voices
                      if (voices != null) {
                          val pt = voices.filter { v ->
                              v.locale.language == "pt" &&
                                  (v.locale.country == "BR" ||
                                   v.name.contains("BR", true) ||
                                   v.name.contains("brazil", true) ||
                                   v.name.contains("brasil", true))
                          }
                          val malePt = pt.firstOrNull {
                              Regex("ricardo|homer|male|masculin|joaquim|felipe",
                                  RegexOption.IGNORE_CASE).containsMatchIn(it.name)
                          }
                          val chosen = malePt ?: pt.firstOrNull()
                          if (chosen != null) {
                              t.voice = chosen
                              t.language = chosen.locale
                          } else {
                              val r = t.setLanguage(Locale("pt", "BR"))
                              if (r == TextToSpeech.LANG_MISSING_DATA ||
                                  r == TextToSpeech.LANG_NOT_SUPPORTED) {
                                  t.setLanguage(Locale.getDefault())
                              }
                          }
                      } else {
                          val r = t.setLanguage(Locale("pt", "BR"))
                          if (r == TextToSpeech.LANG_MISSING_DATA ||
                              r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              t.setLanguage(Locale.getDefault())
                          }
                      }
                      t.setPitch(0.85f)
                      t.setSpeechRate(0.98f)
                  } catch (_: Exception) {
                      try { t.setLanguage(Locale.getDefault()) } catch (_: Exception) {}
                  }
              }

              fun stop() {
                  try { tts?.stop() } catch (_: Exception) {}
                  try { player?.stop(); player?.release() } catch (_: Exception) {}
                  player = null
              }

              fun speak(text: String, onDone: () -> Unit) {
                  val ctx = appCtx
                  if (ctx != null && azureKey(ctx).isNotBlank()) {
                      speakAzure(ctx, text, onDone)
                  } else {
                      speakDevice(text, onDone)
                  }
              }

              private fun speakDevice(text: String, onDone: () -> Unit) {
                  val t = tts
                  if (t == null || !ready) { main.post(onDone); return }
                  Bus.state.value = Bus.State.SPEAKING
                  t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) {
                          main.post { Bus.state.value = Bus.State.IDLE; onDone() }
                      }
                      override fun onError(utteranceId: String?) {
                          main.post { Bus.state.value = Bus.State.IDLE; onDone() }
                      }
                  })
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, Bundle(), "atlas_${System.nanoTime()}")
              }

              private fun speakAzure(ctx: Context, text: String, onDone: () -> Unit) {
                  Bus.state.value = Bus.State.SPEAKING
                  Thread {
                      try {
                          val key = azureKey(ctx)
                          val region = azureRegion(ctx)
                          val voice = azureVoice(ctx)
                          val lang = if (voice.startsWith("pt")) "pt-BR" else "en-GB"
                          val ssml = "<speak version='1.0' xml:lang='$lang'><voice name='$voice'>$text</voice></speak>"
                          val c = URL("https://$region.tts.speech.microsoft.com/cognitiveservices/v1")
                              .openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.connectTimeout = 15000
                          c.readTimeout = 30000
                          c.doOutput = true
                          c.setRequestProperty("Ocp-Apim-Subscription-Key", key)
                          c.setRequestProperty("Content-Type", "application/ssml+xml")
                          c.setRequestProperty("X-Microsoft-OutputFormat", "audio-24khz-48kbitrate-mono-mp3")
                          c.outputStream.use { it.write(ssml.toByteArray(Charsets.UTF_8)) }
                          val code = c.responseCode
                          if (code !in 200..299) throw RuntimeException("HTTP $code")
                          val bytes = c.inputStream.use { it.readBytes() }
                          val f = File(ctx.cacheDir, "atlas_tts.mp3")
                          f.writeBytes(bytes)
                          main.post {
                              try {
                                  player?.release()
                                  player = MediaPlayer().apply {
                                      setAudioAttributes(
                                          AudioAttributes.Builder()
                                              .setUsage(AudioAttributes.USAGE_ASSISTANT)
                                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                              .build()
                                      )
                                      setDataSource(f.absolutePath)
                                      prepare()
                                      start()
                                      setOnCompletionListener {
                                          Bus.state.value = Bus.State.IDLE
                                          onDone()
                                      }
                                      setOnErrorListener { _, _, _ ->
                                          Bus.state.value = Bus.State.IDLE
                                          speakDevice(text, onDone)
                                          true
                                      }
                                  }
                              } catch (_: Exception) {
                                  speakDevice(text, onDone)
                              }
                          }
                      } catch (_: Exception) {
                          main.post { speakDevice(text, onDone) }
                      }
                  }.start()
              }
          }
          FIM_VOICE

          cat > app/src/main/java/com/atlas/assistant/AiTool.kt << 'FIM_AIT'
          package com.atlas.assistant

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object AiTool {

              data class P(
                  val id: String,
                  val label: String,
                  val url: String,
                  val defaultModel: String,
                  val isGemini: Boolean
              )

              val providers = listOf(
                  P("groq", "GROQ", "https://api.groq.com/openai/v1/chat/completions", "llama-3.3-70b-versatile", false),
                  P("openai", "OPENAI", "https://api.openai.com/v1/chat/completions", "gpt-4o-mini", false),
                  P("openrouter", "OPENROUTER", "https://openrouter.ai/api/v1/chat/completions", "meta-llama/llama-3.3-70b-instruct:free", false),
                  P("gemini", "GEMINI", "https://generativelanguage.googleapis.com/v1beta/models/", "gemini-1.5-flash", true)
              )

              private const val SYS = "Voce e o ATLAS, um assistente pessoal de voz no estilo do Jarvis do Homem de Ferro. Responda sempre em portugues do Brasil, com no maximo 3 frases, de forma elegante, direta e util, tratando o usuario como senhor."

              fun activeId(ctx: Context): String? =
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE).getString("ai_active", null)

              fun save(ctx: Context, id: String, key: String, model: String) {
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE).edit()
                      .putString("key_$id", key)
                      .putString("model_$id", model)
                      .putString("ai_active", id)
                      .apply()
              }

              fun getKey(ctx: Context, id: String): String =
                  ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE).getString("key_$id", "") ?: ""

              fun getModel(ctx: Context, id: String): String {
                  val d = providers.firstOrNull { it.id == id }?.defaultModel ?: ""
                  return ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE).getString("model_$id", d) ?: d
              }

              suspend fun ask(ctx: Context, prompt: String): String? = withContext(Dispatchers.IO) {
                  val id = activeId(ctx) ?: return@withContext null
                  val p = providers.firstOrNull { it.id == id } ?: return@withContext null
                  val key = getKey(ctx, id)
                  if (key.isBlank()) return@withContext null
                  val model = getModel(ctx, id)
                  try {
                      if (p.isGemini) askGemini(p, key, model, prompt) else askOpenAi(p, key, model, prompt)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun askOpenAi(p: P, key: String, model: String, prompt: String): String {
                  val body = JSONObject()
                  body.put("model", model)
                  body.put("max_tokens", 300)
                  val msgs = JSONArray()
                  msgs.put(JSONObject().put("role", "system").put("content", SYS))
                  msgs.put(JSONObject().put("role", "user").put("content", prompt))
                  body.put("messages", msgs)
                  val resp = post(p.url, body, "Authorization" to "Bearer $key")
                  return JSONObject(resp)
                      .getJSONArray("choices").getJSONObject(0)
                      .getJSONObject("message").getString("content").trim()
              }

              private fun askGemini(p: P, key: String, model: String, prompt: String): String {
                  val url = p.url + model + ":generateContent?key=" + key
                  val body = JSONObject()
                  val part = JSONObject().put("text", prompt)
                  val contents = JSONArray().put(JSONObject().put("parts", JSONArray().put(part)))
                  body.put("contents", contents)
                  val resp = post(url, body, null)
                  return JSONObject(resp)
                      .getJSONArray("candidates").getJSONObject(0)
                      .getJSONObject("content").getJSONArray("parts").getJSONObject(0)
                      .getString("text").trim()
              }

              private fun post(url: String, body: JSONObject, auth: Pair<String, String>?): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 30000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  if (auth != null) c.setRequestProperty(auth.first, auth.second)
                  c.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) throw RuntimeException("HTTP $code: $text")
                  return text
              }
          }
          FIM_AIT

          cat > app/src/main/java/com/atlas/assistant/WeatherTool.kt << 'FIM_WEATHER'
          package com.atlas.assistant

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import java.net.URL
          import java.net.URLEncoder

          object WeatherTool {
              suspend fun fetch(ctx: Context, q: String): String = withContext(Dispatchers.IO) {
                  val city = Regex("clima (?:em|de|do) ([a-z\\-\\s]+)").find(q)?.groupValues?.get(1)?.trim()
                      ?: Regex("tempo (?:em|de) ([a-z\\-\\s]+)").find(q)?.groupValues?.get(1)?.trim()
                  val prefs = ctx.getSharedPreferences("atlas", Context.MODE_PRIVATE)
                  val name = (city?.trimEnd('?', '.', '!')) ?: prefs.getString("city", "São Paulo")!!
                  if (city != null) prefs.edit().putString("city", name).apply()

                  val geo = json("https://geocoding-api.open-meteo.com/v1/search" +
                          "?name=${URLEncoder.encode(name, "UTF-8")}&count=1&language=pt")
                  val g = geo.optJSONArray("results")?.optJSONObject(0)
                      ?: return@withContext "Não encontrei a cidade \"$name\", senhor."
                  val lat = g.getDouble("latitude"); val lon = g.getDouble("longitude")
                  val resolved = g.optString("name", name)

                  val w = json("https://api.open-meteo.com/v1/forecast" +
                          "?latitude=$lat&longitude=$lon&current_weather=true")
                  val cw = w.getJSONObject("current_weather")
                  val temp = cw.getDouble("temperature")
                  val wind = cw.getDouble("windspeed")
                  "Em $resolved: ${describe(cw.getInt("weathercode"))}, " +
                          "$temp graus, vento de ${wind.toInt()} quilômetros por hora, senhor."
              }

              private fun json(url: String): JSONObject =
                  JSONObject(URL(url).openStream().bufferedReader().use { it.readText() })

              private fun describe(c: Int) = when (c) {
                  0 -> "céu limpo"
                  in 1..2 -> "predominantemente limpo"
                  3 -> "nublado"
                  in 45..48 -> "nevoeiro"
                  in 51..57 -> "garoa"
                  in 61..67 -> "chuva"
                  in 71..77 -> "neve"
                  in 80..82 -> "pancadas de chuva"
                  in 85..86 -> "pancadas de neve"
                  in 95..99 -> "trovoada"
                  else -> "céu instável"
              }
          }
          FIM_WEATHER

          cat > app/src/main/java/com/atlas/assistant/AtlasBrain.kt << 'FIM_BRAIN'
          package com.atlas.assistant

          import android.app.ActivityManager
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.text.Normalizer
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object AtlasBrain {
              private var player: MediaPlayer? = null
              private var torchOn = false

              suspend fun handle(ctx: Context, raw: String): String =
                  try { route(ctx, raw, normalize(raw)) }
                  catch (e: Exception) { "Encontrei uma falha ao executar: ${e.message}, senhor." }

              private fun normalize(s: String) =
                  Normalizer.normalize(s.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "").trim()

              private suspend fun route(ctx: Context, raw: String, q: String): String = when {
                  q == "oi" || q == "ola" || "bom dia" in q || "boa tarde" in q || "boa noite" in q
                          || "hello" in q -> listOf(
                      "Às suas ordens, senhor.",
                      "Olá. Todos os sistemas à sua disposição.",
                      "Pois não, senhor?"
                  ).random()

                  "lanterna" in q || "luz" in q || "torch" in q || "flashlight" in q -> flashlight(ctx, q)
                  "protocolo casa de festas" in q || "party mode" in q -> partyMode(ctx)
                  "bateria" in q || "battery" in q -> battery(ctx)
                  "hora" in q && ("que" in q || "diga" in q || "horas" in q || "me" in q) -> time()
                  "data" in q || "que dia" in q -> date()
                  "clima" in q || "tempo em" in q || "previsao" in q || "weather" in q -> WeatherTool.fetch(ctx, q)
                  "parar" in q && ("musica" in q || "music" in q) -> { stopMusic(); "Reprodução interrompida, senhor." }
                  "tocar" in q || "play " in q -> music(ctx, q)
                  "abrir" in q || "open " in q -> openApp(ctx, q)
                  "ligar para" in q || "call " in q -> callContact(ctx, q)
                  "mensagem" in q || "sms" in q -> sms(ctx, raw, q)
                  "timer" in q || "cronometro" in q -> timer(ctx, q)
                  "alarme" in q || "alarm" in q -> alarm(ctx, q)
                  "volume" in q || "mudo" in q || "mute" in q -> volume(ctx, q)
                  "wi-fi" in q || "wifi" in q || "internet" in q -> panel(ctx, Settings.ACTION_WIFI_SETTINGS, Settings.ACTION_WIFI_SETTINGS)
                  "bluetooth" in q -> panel(ctx, Settings.ACTION_BLUETOOTH_SETTINGS, Settings.ACTION_BLUETOOTH_SETTINGS)
                  "pesquisar" in q || "pesquise" in q || "busque" in q || "search" in q -> webSearch(ctx, raw)
                  "calcule" in q || "quanto e" in q || Regex("\\d+\\s*[+\\-x*/^]").containsMatchIn(q) -> calc(q)
                  "diagnostico" in q || "status" in q || "relatorio" in q -> diagnostics(ctx)
